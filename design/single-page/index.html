const en={draft:'Interactive design',workspace:'Local functions',saved:'Save draft',title:'Turn judgment into a function',subtitle:'Choose a primitive, define the criteria, and try a real scenario.',noul:'Assess a proposition',choice:'Choose a category',score:'Rate on an ordered scale',configure:'Define the judgment',tryout:'Try it out',name:'Function name',instruction:'Instructions',claim:'Proposition to evaluate',criteria:'Categories',levels:'Scoring levels',add:'Add option',advanced:'Review rules & advanced settings',review:'Send uncertain results for human review',threshold:'Review threshold',model:'Pinned model',reviewHelp:'Review Noul near 0.5, or Choice / Score below the confidence threshold.',input:'Input material',normal:'Typical example',unclear:'Insufficient context',failure:'Simulate failure',run:'Run test',running:'Simulating…',result:'Result',example:'Example result',simulated:'Simulated result',stale:'Config changed · Run again',yes:'Likely supported',no:'Likely unsupported',unknown:'Needs review',absent:'Unsupported',present:'Supported',probability:'Probability is not accuracy. This is an illustrative result.',raw:'View response JSON',local:'Offline simulation. No TypeSafe requests.',connect:'Publish & connect',connectNote:'Expand when you need to reuse it',publishTitle:'Reuse as a function',publishCopy:'In the full app, publish a pinned version after a successful test, then grant access to a service or agent.',publish:'Preview release',previewNote:'Design preview only. No versions, credentials or agent configuration are created.',copy:'Copy example',reference:'Coss UI style reference',bottom:'Design preview · Switch, edit and test on one page',autosave:'Draft saved in this browser',copyDone:'Example copied',empty:'Add input material before running a test.',error:'Simulated request failed. Your input is preserved. Change the example and retry.',reviewResult:'Insufficient information. Retain the result for human review.',detail:'Simulated data for the esponse(),null,2))}</pre></details>`:''}`}
function code(){let d=drafts[kind];return transport==='HTTP'?`curl http://127.0.0.1:17430/v1/functions/${d.key}/invoke \\\n  -H "Authorization: Bearer $JEV_CLIENT_TOKEN" \\\n  -H 'Content-Type: application/json' \\\n  -d '{"version":1,"input":{"content":"…"}}'`:transport==='MCP'?`jev_invoke({\n  key: "${d.key}",\n  version: 1,\n  input: { content: "…" }\n})`:`// Pi · jev_invoke\n{\n  "key": "${d.key}",\n  "input": { "content": "…" }\n}`}
function render(){const d=drafts[kind];document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.getElementById('app').innerHTML=`<header><div class="logo">j</div><span class="brand">Jev</span><span class="slash">/</span><span class="header-meta">${t('workspace')}</span><span class="spacer"></span><span class="badge">${t('draft')}</span><button class="quiet small" id="language">${lang==='zh'?'English':'中文'}</button></header><aside class="design-rail"><h2>${lang==='zh'?'判断函数':'Functions'}</h2>${['noul','choice','score'].map(k=>`<button data-kind="${k}" class="${kind===k?'active':''}"><span>${escape(drafts[k].name)}<small>${k.toUpperCase()} · ${lang==='zh'?'草稿':'Draft'}</small></span></button>`).join('')}<p class="help">${lang==='zh'?'左侧选函数，右侧配置与测试。新增、归档与删除在正式工作台接入真实数据。':'Select a function to edit and test. Creation, archiving and deletion are wired to data in the workbench.'}</p></aside><main><div class="title-row"><h1>${t('title')}</h1><button class="save" id="save">${icon('save')}${t('saved')}</button></div><p class="subhead">${t('subtitle')}</p><div class="primitives" role="group" aria-label="Primitive">${['noul','choice','score'].map(k=>`<button class="primitive ${kind===k?'active':''}" data-kind="${k}" aria-pressed="${kind===k}"><span class="primitive-icon">${icon(k)}</span><span><strong>${k[0].toUpperCase()+k.slice(1)}</strong><span class="note">${t(k)}</span></span>${kind===k?icon('check','checkmark'):''}</button>`).join('')}</div><div class="workbench"><section class="configure"><div class="section-heading">${icon('settings')}<h2>${t('configure')}</h2><span class="badge" id="save-state">${t(saved?'savedState':'dirty')}</span></div>${field('name',t('name'),d.name)}${field('instruction',t('instruction'),d.instruction,true)}${kind==='noul'?field('claim',t('claim'),d.claim,true):`<div class="field"><span class="field-label">${t(kind==='choice'?'criteria':'levels')}</span><div class="options">${d.options.map((o,i)=>`<div class="option"><input class="key" aria-label="${kind==='choice'?'Key':'Level'} ${i+1}" data-option="${i}" data-col="0" value="${escape(o[0])}" ${kind==='score'?'readonly':''}><input aria-label="${kind==='choice'?'Category':'Level'} description ${i+1}" data-option="${i}" data-col="1" value="${escape(o[1])}"><button class="remove" ${d.options.length<=2?'disabled':''} data-remove="${i}" aria-label="${t('remove')} ${i+1}">${icon('minus')}</button></div>`).join('')}</div><p class="help">${t(kind==='choice'?'optionsHelp':'levelsHelp')}</p><button id="add-option" class="quiet small" style="margin-top:7px">${icon('plus')}${t('add')}</button></div>`}<details class="advanced"><summary>${icon('chevron','chevron')}${t('advanced')}</summary><div class="advanced-body"><label class="switchline"><input type="checkbox" id="review" ${d.review?'checked':''}>${t('review')}</label><p class="help">${t('reviewHelp')}</p><div class="field-row" style="margin-top:15px"><label class="field"><span class="field-label">${t('threshold')}</span><input type="number" min="0" max="1" step=".05" id="threshold" data-field="threshold" value="${d.threshold}"></label><label class="field"><span class="field-label">${t('model')}</span><select aria-label="${t('model')}"><option>jev-1.13.0</option></select></label></div>${field('key',t('functionKey'),d.key)}<p class="help">${t('exportHelp')}</p></div></details></section><section class="tryout"><div class="section-heading">${icon('play')}<h2>${t('tryout')}</h2></div><div class="test-head"><label class="field-label" for="input">${t('input')}</label><div class="inline-controls"><select id="scenario" aria-label="${lang==='zh'?'选择样例':'Choose example'}"><option value="normal">${t('normal')}</option><option value="unclear">${t('unclear')}</option><option value="failure">${t('failure')}</option></select></div></div><textarea class="test-input" id="input" data-field="input">${escape(d.input)}</textarea><div class="run-row"><button class="dark" id="run" ${busy?'disabled':''}>${icon('play')}${t(busy?'running':'run')}</button></div><div class="result" id="result" aria-live="polite">${resultHTML()}</div></section><div class="footer-strip">${icon('code')}<span>${t('local')}</span><span class="mono">${escape(d.key)} · ${kind} · jev-1.13.0</span></div></div><details class="connect" id="connect"><summary>${icon('chevron','chevron')}<span>${t('connect')}</span><span class="summary-note">${t('connectNote')}</span></summary><div class="connect-body"><div><h2>${t('publishTitle')}</h2><p>${t('publishCopy')}</p><button id="publish">${t('publish')}</button><p>${t('previewNote')}</p><pre id="release" hidden></pre></div><div><div class="transport">${['HTTP','MCP','Pi'].map(x=>`<button class="small ${transport===x?'active':''}" data-transport="${x}">${x}</button>`).join('')}<span class="spacer"></span><button class="quiet small" id="copy">${t('copy')}</button></div><pre id="code">${escape(code())}</pre></div></div></details><footer class="bottom"><span>${t('bottom')}</span><span class="end"><a href="https://coss.com/ui/docs/styling" target="_blank" rel="noreferrer">${t('reference')}</a></span></footer></main>`;document.getElementById('scenario').value=d.scenario;bind()}
function dirty(){saved=false;drafts[kind].edited=true;drafts[kind].result='stale';document.getElementById('save-state').textContent=t('dirty');document.getElementById('result').innerHTML=resultHTML()}
function toast(s){document.getElementById('toast').textContent=s;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',2800)}
function bind(){document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;render()});document.querySelectorAll('[data-field]').forEach(e=>e.oninput=()=>{drafts[kind][e.dataset.field]=e.type==='number'?Number(e.value):e.value;dirty()});document.querySelectorAll('[data-option]').forEach(e=>e.oninput=()=>{drafts[kind].options[+e.dataset.option][+e.dataset.col]=e.value;dirty()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(drafts[kind].options.length<=2)return;drafts[kind].options.splice(+b.dataset.remove,1);if(kind==='score')drafts[kind].options.forEach((o,i)=>o[0]=String(i));dirty();render()});document.getElementById('add-option')?.addEventListener('click',()=>{const d=drafts[kind];d.options.push([kind==='score'?String(d.options.length):'option_'+(d.options.length+1),lang==='zh'?'新选项':'New option']);dirty();render()});document.getElementById('review').onchange=e=>{drafts[kind].review=e.target.checked;dirty()};document.getElementById('language').onclick=()=>{lang=lang==='zh'?'en':'zh';for(const k of Object.keys(drafts))if(!drafts[k].edited)drafts[k]=base(k,lang);render()};document.getElementById('save').onclick=()=>{try{localStorage.setItem('jev-single-page-design',JSON.stringify({lang,kind,drafts}));saved=true;document.getElementById('save-state').textContent=t('savedState');toast(t('autosave'))}catch{toast(lang==='zh'?'浏览器不允许保存，请保留当前页面。':'Browser storage is unavailable. Keep this page open.')}};document.getElementById('scenario').onchange=e=>{let d=drafts[kind];d.scenario=e.target.value;d.input=d.scenario==='normal'?base(kind,lang).input:d.scenario==='unclear'?(lang==='zh'?'信息不清楚，需要进一步核实。':'The information is unclear and needs review.'):(lang==='zh'?'模拟错误':'simulate error');dirty();render()};document.getElementById('run').onclick=async()=>{const selected=kind,d=drafts[selected];if(!d.input.trim()){d.result='empty';render();return}busy=true;render();await new Promise(r=>setTimeout(r,550));d.result=/模拟错误|simulate error/i.test(d.input)?'error':/不清楚|unclear/i.test(d.input)&&d.review?'review':'ok';busy=false;render()};document.getElementById('publish').onclick=()=>{const el=document.getElementById('release');el.hidden=!el.hidden;el.textContent=JSON.stringify({preview_only:true,key:drafts[kind].key,primitive:kind,version:1},null,2)};document.querySelectorAll('[data-transport]').forEach(b=>b.onclick=()=>{transport=b.dataset.transport;document.getElementById('code').textContent=code();document.querySelectorAll('[data-transport]').forEach(x=>x.classList.toggle('active',x===b))});document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(code());toast(t('copyDone'))}catch{toast(lang==='zh'?'请选择并复制下方代码。':'Select and copy the code below.')}}}
render();
</script></body></html>
